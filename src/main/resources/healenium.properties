# Healenium Self-Healing Configuration
# =====================================

# Number of recovery attempts when a locator fails
recovery-tries=1

# Minimum similarity score (0.0-1.0) for healed element to be accepted
# Higher value = stricter matching (less false positives)
# Lower value = more flexible matching (may match wrong element)
score-cap=0.5

# Enable/disable Healenium self-healing globally
heal-enabled=true

# Healenium backend server configuration
# These match the Docker Compose service settings
serverHost=localhost
serverPort=7878
